[package]
name = "nixe-passwords-core"
version = "0.1.0"
description = "Vaultwarden client library for Nixe Passwords"
edition.workspace = true
license = "GPL-3.0-only"
authors.workspace = true
repository.workspace = true

[dependencies]
nixe-passwords-proto = { path = "../nixe-passwords-proto" }
aes-gcm = "0.11"
bitwarden-crypto = "=4.0.0"
bitwarden-encoding = "=4.0.0"
reqwest = { version = "0.13", features = ["json", "form", "multipart"] }
hkdf = "0.13"
psl = "2"
rand = "0.10"
regex = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
sha2 = "0.11"
ssh-key = { version = "=0.7.0-rc.11", features = ["ed25519"] }
zxcvbn = "3"
tokio = { version = "1", features = ["rt"] }
totp-rs = { version = "6", features = ["otpauth", "steam", "zeroize"] }
url = "2"
x25519-dalek = { version = "3", features = ["getrandom"] }
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1"

[dev-dependencies]
x25519-dalek = { version = "3", features = ["getrandom", "static_secrets"] }
reqwest = { version = "0.13", features = ["blocking", "json", "form"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util"] }
tempfile = "3"
