[package]
name = "nixe-passwords-core"
version = "0.1.0"
description = "Vaultwarden client library for Nixe Passwords"
edition.workspace = true
license = "GPL-3.0-only"
authors.workspace = true
repository.workspace = true

[dependencies]
bitwarden-crypto = "=4.0.0"
bitwarden-encoding = "=4.0.0"
reqwest = { version = "0.13", features = ["json", "form"] }
rand = "0.10"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt"] }
totp-rs = { version = "6", features = ["otpauth", "steam", "zeroize"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1"

[dev-dependencies]
reqwest = { version = "0.13", features = ["blocking", "json", "form"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile = "3"
