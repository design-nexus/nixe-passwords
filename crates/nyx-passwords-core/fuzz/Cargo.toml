[package]
name = "nyx-passwords-core-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "GPL-3.0-only"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
nyx-passwords-core = { path = ".." }
serde_json = "1"
url = "2"
bitwarden-encoding = "4.0.0"

# Its own workspace: fuzzing builds with nightly and sanitizers, apart from the suite.
[workspace]
members = ["."]

[[bin]]
name = "sync"
path = "fuzz_targets/sync.rs"
test = false
doc = false
bench = false

[[bin]]
name = "enc_string"
path = "fuzz_targets/enc_string.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pairing"
path = "fuzz_targets/pairing.rs"
test = false
doc = false
bench = false

[[bin]]
name = "totp"
path = "fuzz_targets/totp.rs"
test = false
doc = false
bench = false

[[bin]]
name = "matching"
path = "fuzz_targets/matching.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ssh"
path = "fuzz_targets/ssh.rs"
test = false
doc = false
bench = false
