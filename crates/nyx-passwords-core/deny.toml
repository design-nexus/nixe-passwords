# cargo deny check (run from this directory); policy in apps/passwords/docs/SECURITY.md
[graph]
exclude-dev = true

[advisories]
ignore = [
    # Marvin timing side channel in rsa, no fixed version. RSA here only unwraps org keys
    # locally, from the user's own server; its timing isn't observable remotely.
    # Revisit with every bitwarden-crypto upgrade (apps/passwords/docs/DEPENDENCIES.md).
    { id = "RUSTSEC-2023-0071", reason = "local-only RSA decryption; no fix available" },
]

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
         "ISC", "Zlib", "Unicode-3.0", "MPL-2.0", "CDLA-Permissive-2.0", "GPL-3.0-only"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
