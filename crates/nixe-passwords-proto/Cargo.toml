[package]
name = "nixe-passwords-proto"
version = "0.1.0"
description = "The Nixe Passwords daemon's interface: names, paths and wire types"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
gio = { version = "0.22", optional = true }

[features]
# A client for GTK programs (the Passwords window, Glimpse), on the GLib main loop.
client = ["dep:gio"]
