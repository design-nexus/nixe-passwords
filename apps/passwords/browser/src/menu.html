<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Nyx Passwords</title>
    <link rel="stylesheet" href="theme.css" />
    <style>
      html, body { background: transparent; }
      body { margin: 0; background: var(--popover); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
      .head { display: flex; align-items: center; gap: 8px; padding: 9px 12px 7px; color: var(--dim); font-size: 12px; }
      .head .mark { width: 18px; height: 18px; border-radius: 5px; background: var(--accent); color: var(--on-accent); display: inline-flex; align-items: center; justify-content: center; }
      .head .name { font-weight: 600; color: var(--text); }
      .head .host { margin-left: auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 55%; }
      #list { max-height: 268px; overflow-y: auto; padding: 0 6px 6px; scrollbar-width: thin; }
      .row { min-height: 44px; padding: 6px 8px; }
      .row:focus { background: var(--hover); outline: none; }
      .row .go { color: var(--tertiary); opacity: 0; }
      .row:hover .go, .row:focus .go { opacity: 1; }
      .note { padding: 8px 10px 10px; color: var(--dim); line-height: 1.4; }
      .note.error { color: var(--danger); }
      .sep { height: 1px; background: var(--divider); margin: 4px 6px; }
    </style>
  </head>
  <body>
    <div class="head"><span class="mark" id="mark"></span><span class="name">Passwords</span><span class="host" id="host"></span></div>
    <div id="list"></div>
    <script src="nyx.js"></script>
    <script src="menu.js"></script>
  </body>
</html>
