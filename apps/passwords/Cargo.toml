[package]
name = "nixe-passwords"
version = "0.1.0"
description = "A password manager for Vaultwarden"
default-run = "nixe-passwords"
edition.workspace = true
license = "GPL-3.0-only"
authors.workspace = true
repository.workspace = true

[dependencies]
nixe-core = { git = "https://github.com/design-nexus/nixe-core.git", rev = "e4595e68a4fd9b44bd15e95311ace1d0fb669bc4" }
nixe-theme = { git = "https://github.com/design-nexus/nixe-design.git", rev = "0319940fb27bb5fc7f04742bcb2bd331b384c425" }
nixe-ui = { git = "https://github.com/design-nexus/nixe-design.git", rev = "0319940fb27bb5fc7f04742bcb2bd331b384c425" }
gtk = { version = "0.11", package = "gtk4", features = ["v4_18"] }
nixe-passwords-core = { path = "../../crates/nixe-passwords-core" }
nixe-passwords-proto = { path = "../../crates/nixe-passwords-proto", features = ["client"] }
base64 = "0.22"
libc = "0.2"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-util"] }
toml = "1"
url = "2"
uuid = { version = "1", features = ["v4"] }
wl-clipboard-rs = "0.9"
zeroize = "1"
futures-util = "0.3"
zbus = { version = "5", default-features = false, features = ["tokio", "p2p"] }

[dev-dependencies]
aes-gcm = "0.11"
hkdf = "0.13"
sha2 = "0.11"
x25519-dalek = { version = "3", features = ["getrandom", "static_secrets"] }
bitwarden-crypto = "=4.0.0"
reqwest = { version = "0.13", features = ["json"] }
tempfile = "3"
