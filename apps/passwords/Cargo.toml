[package]
name = "nyx-passwords"
version = "0.1.0"
description = "A password manager for Vaultwarden"
default-run = "nyx-passwords"
edition.workspace = true
license = "GPL-3.0-only"
authors.workspace = true
repository.workspace = true

[dependencies]
nyx-core = { git = "https://github.com/design-nexus/nyx-core.git", rev = "52cba5e27a3dd5f00c780f53e423302b4b5f9c9c" }
nyx-theme = { git = "https://github.com/design-nexus/nyx-design.git", rev = "144e77df1b6561fd8d0667e0d58306696c3e4d63" }
nyx-ui = { git = "https://github.com/design-nexus/nyx-design.git", rev = "144e77df1b6561fd8d0667e0d58306696c3e4d63" }
gtk = { version = "0.11", package = "gtk4", features = ["v4_18"] }
nyx-passwords-core = { path = "../../crates/nyx-passwords-core" }
nyx-passwords-proto = { path = "../../crates/nyx-passwords-proto", features = ["client"] }
base64 = "0.22"
libc = "0.2"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-util"] }
toml = "1"
url = "2"
uuid = { version = "1", features = ["v4"] }
wl-clipboard-rs = "0.9"
zeroize = "1"
futures-util = "0.3"
zbus = { version = "5", default-features = false, features = ["tokio", "p2p"] }

[dev-dependencies]
aes-gcm = "0.11"
hkdf = "0.13"
sha2 = "0.11"
x25519-dalek = { version = "3", features = ["getrandom", "static_secrets"] }
bitwarden-crypto = "=4.0.0"
reqwest = { version = "0.13", features = ["json"] }
tempfile = "3"
